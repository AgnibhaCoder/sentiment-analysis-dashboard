<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Sentiment Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 600px; }
        textarea { width: 100%; height: 120px; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 16px; resize: none; box-sizing: border-box; outline: none; transition: border 0.2s; }
        textarea:focus { border-color: #3b82f6; }
        .result-card { margin-top: 20px; padding: 20px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 18px; display: none; }
        .positive { background: #d1fae5; color: #065f46; border: 1px solid #34d399; }
        .negative { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
        .score { font-size: 14px; font-weight: normal; margin-top: 5px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <h2>Live Sentiment Analysis</h2>
    <p>Type anything below to test the Hugging Face model in real-time:</p>
    <textarea id="text-input" placeholder="Start typing your thoughts here..."></textarea>
    
    <div id="result" class="result-card">
        Sentiment: <span id="label">NEUTRAL</span>
        <div id="confidence" class="score">Confidence: 0.00%</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
<script src="../src/index.js"></script>
</body>
</html>
